# Siriopsis(시리우스 파셋 표본 뷰어)를 80 포트의 /Siriopsis/ 아래에 얹는다.
# Cropobite deploy/nginx/Cropobite-subpath.conf 에서 왔다(그 뿌리는 ForGIA) — 서브경로로 얹는 까닭도 같다
# (사내 VPN 이 80 만 통과시키고, 80 은 phyloserver 블록이 `server_name 172.16.116.98 paleolab` 으로 잡고 있다).
#
# 설치 (deploy/host/install.sh 가 한다):
#   sudo cp deploy/nginx/Siriopsis-subpath.conf /etc/nginx/snippets/
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/Siriopsis-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# **점검 안내(maintenance.flag)는 아직 없다** — 깃발을 세우는 deploy.sh 가 없어서다. 뷰어가 안 받을 때의 안내만 둔다.

location = /Siriopsis-unavailable.html {
    internal;
    root /srv/Siriopsis/www;
    add_header Cache-Control "no-store" always;
}

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 없으면 Django 가 /Siriopsis 를 못 찾는다
location = /Siriopsis {
    return 301 /Siriopsis/;
}

# 대소문자를 틀리게 친 주소를 정식 주소로. 아래 블록의 `^~` 가 정식 주소를 이 정규식에서 지킨다(안 그러면 무한 301).
# **`/siriuspasset` 과 헷갈리지 않는다** — 그쪽은 phyloserver 의 목록이고 이 정규식은 `siriopsis` 만 잡는다.
location ~* ^/siriopsis(/.*)?$ {
    return 301 /Siriopsis$1;
}

location ^~ /Siriopsis/ {
    error_page 502 504 /Siriopsis-unavailable.html;
    proxy_intercept_errors on;

    # **끝의 슬래시가 핵심이다** — nginx 가 /Siriopsis/ 를 떼고 넘긴다. Django 는 뿌리에 붙은 것처럼
    # 해석하고, 링크를 만들 때만 FORCE_SCRIPT_NAME=/Siriopsis 를 앞에 붙인다.
    proxy_pass http://127.0.0.1:8100/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 20 MP 원본을 처음 줄이는 요청은 0.2~0.5 초, 몰리면 더 걸린다
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # 고해상도에서 확대하면 원본(장당 7~8 MB)을 내보낸다
    proxy_buffering on;
}
