<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}Siriopsis</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fafafa; }
  header { display: flex; align-items: baseline; gap: .75rem; padding: .75rem 1rem; border-bottom: 1px solid #ddd; background: #fff; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  .ver { font-size: .8rem; color: #888; }
  main { padding: 1rem; max-width: 60rem; }
  .env-label { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               pointer-events: none; font-size: 8vw; font-weight: 700; color: rgba(200, 0, 0, .12);
               transform: rotate(-30deg); z-index: 9999; }
</style>
</head>
<body>
<header>
  <a href="{% url 'home' %}">Siriopsis</a>
  {% if image_tag %}<span class="ver">{{ image_tag }}</span>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
{% if env_label %}<div class="env-label">{{ env_label }}</div>{% endif %}
</body>
</html>
