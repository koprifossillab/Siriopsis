<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}Siriopsis</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --fg: #222; --dim: #777; --line: #ddd;
          --accent: #2b6cb0; --chip: #eef2f7; --view: #1b1b1b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
           padding: .6rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { color: inherit; font-weight: 700; }
  header .sub { color: var(--dim); font-size: .92rem; }
  header .sub b { color: var(--fg); }
  header .nav { margin-left: auto; display: flex; gap: .8rem; font-size: .92rem; }
  .ver { font-size: .8rem; color: #888; }
  main { padding: 1rem; max-width: 72rem; }
  main.wide { max-width: none; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, monospace; font-size: .88em; }
  .chip { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: var(--chip);
          font-size: .8rem; color: var(--fg); white-space: nowrap; }
  .chip.ptm { background: #fdecc8; }
  .chip.copy { background: #eee; color: var(--dim); }
  button, select, input { font: inherit; }
  .env-label { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               pointer-events: none; font-size: 8vw; font-weight: 700; color: rgba(200, 0, 0, .12);
               transform: rotate(-30deg); z-index: 9999; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <a class="brand" href="{% url 'home' %}">Siriopsis</a>
  {% if image_tag %}<span class="ver">{{ image_tag }}</span>{% endif %}
  <span class="sub">{% block subtitle %}{% endblock %}</span>
  <span class="nav">{% block nav %}{% endblock %}</span>
</header>
<main{% block mainclass %}{% endblock %}>{% block content %}{% endblock %}</main>
{% if env_label %}<div class="env-label">{{ env_label }}</div>{% endif %}
</body>
</html>
